name: Daily Event Tender Crawler

on:
  workflow_dispatch:

  push:
    branches:
      - main
    paths:
      - "tender_agent.py"
      - ".github/workflows/daily_crawler.yml"

  schedule:
    # 03:00 UTC = 08:30 AM IST
    - cron: "0 3 * * *"

jobs:
  crawl-tenders:

    runs-on: ubuntu-latest

    timeout-minutes: 60

    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_MODEL: gpt-5.6-luna

      SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
      SERVICE_ACCOUNT_FILE: service_account.json

      EXCEL_MASTER_FILE: Pan_India_Tender_URL_Master.xlsx
      DOWNLOAD_DIR: tender_downloads

      CRAWL_WORKERS: 10
      REQUEST_TIMEOUT: 20

      MAX_GENERIC_LINKS: 100
      MAX_GENERIC_PAGES: 50
      MAX_PAGES_PER_PORTAL: 100
      MAX_GEM_PAGES_PER_SEARCH: 50
      GENERIC_JS_FALLBACK: true
      CLEAN_EXISTING_ACTIVE_TENDERS: true

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4


      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"


      - name: Upgrade pip
        run: |
          python -m pip install --upgrade pip


      - name: Install dependencies
        run: |
          pip install -r requirements.txt


      - name: Install Playwright Chromium
        run: |
          python -m playwright install --with-deps chromium


      - name: Create Google service account
        shell: bash
        run: |
          printf '%s' '${{ secrets.GCP_SA_KEY }}' > service_account.json


      - name: Validate Python
        run: |
          python -m py_compile tender_agent.py


      - name: Check required files
        run: |
          test -f tender_agent.py
          test -f Pan_India_Tender_URL_Master.xlsx
          test -f service_account.json


      - name: Run Tender Intelligence Agent
        run: |
          python tender_agent.py


      - name: Upload tender documents
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tender-documents-${{ github.run_number }}
          path: tender_downloads/
          if-no-files-found: ignore
          retention-days: 7


      - name: Remove credentials
        if: always()
        run: |
          rm -f service_account.json

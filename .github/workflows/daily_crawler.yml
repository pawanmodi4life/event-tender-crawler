name: Daily Event Tender Agent

on:
  schedule:
    # 03:00 UTC = 08:30 AM IST every day
    - cron: '0 3 * * *'
  workflow_dispatch:

jobs:
  run-crawler:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Application Dependencies
        run: |
          pip install --upgrade pip
          pip install playwright gspread google-auth google-api-python-client google-genai requests beautifulsoup4 pandas openpyxl
          playwright install --with-deps chromium

      - name: Decrypt Credentials & Run Pipeline
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
        run: |
          echo "$GCP_SA_KEY" > service_account.json
          python tender_agent.py
